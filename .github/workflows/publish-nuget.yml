name: Publish to NuGet

# Version comes from <VersionPrefix> in Directory.Build.props, never from a
# hand-typed input, so the published version is always recorded in git.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack without publishing"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token nuget.org exchanges for a
      # short-lived API key. No long-lived secret is involved. The same token
      # signs the build provenance attestation.
      id-token: write
      # Writing the attestation itself.
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Both, because the package multi-targets: Umbraco 16 is .NET 9, 17 and 18 are .NET 10.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Read version from source
        id: version
        run: |
          # Directory.Build.props exists but carries only audit settings; the version lives on
          # the package project.
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/BaryoDev.Umbraco.Pwa/BaryoDev.Umbraco.Pwa.csproj)
          test -n "$VERSION" || { echo "::error::No <Version> found in the csproj"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version from the csproj: $VERSION"

      - name: Confirm tag matches the version in source
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match VersionPrefix $VERSION" >&2
            exit 1
          fi

      - run: dotnet restore src/BaryoDev.Umbraco.Pwa/BaryoDev.Umbraco.Pwa.csproj

      - run: dotnet build src/BaryoDev.Umbraco.Pwa/BaryoDev.Umbraco.Pwa.csproj --configuration Release --no-restore

      # A package must never ship without its tests having run.
      # Everything CI runs, not one project of it. This used to be the unit tests alone, which
      # left the approval test, the audit gate and the browser suite outside the release path.
      # They run on pushes to main, so in practice they usually had run. "Usually" is not what a
      # release gate means, and a tag can be pushed at any commit.
      - name: Refuse to publish a tree with a known advisory
        run: dotnet restore BaryoDev.Umbraco.Pwa.slnx -p:AuditPipeline=true --force

      - name: Test
        run: dotnet test tests/BaryoDev.Umbraco.Pwa.Tests --configuration Release --verbosity normal

      # The surface a consumer compiles against. A change here decides whether this release is a
      # minor or a major, so publishing without it is publishing without knowing which.
      - name: Public API has not changed
        run: dotnet test tests/BaryoDev.Umbraco.Pwa.ApiApproval.Tests --configuration Release --verbosity normal

      - name: Install Playwright
        run: |
          dotnet build tests/BaryoDev.Umbraco.Pwa.Browser.Tests -c Release
          pwsh tests/BaryoDev.Umbraco.Pwa.Browser.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # The only thing that executes a line of the generated service worker. Three defects reached
      # 0.2.0 with every text assertion green, which is why this suite exists at all.
      - name: Service worker behaviour
        run: dotnet test tests/BaryoDev.Umbraco.Pwa.Browser.Tests --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack src/BaryoDev.Umbraco.Pwa/BaryoDev.Umbraco.Pwa.csproj --configuration Release --no-build --output ./nupkgs

      - name: List artifacts
        run: ls -la ./nupkgs

      # An agency's procurement asks for this before a package goes into a client site, which is
      # the audience this package is trying to reach.
      - name: Generate an SBOM
        run: |
          dotnet tool install --global CycloneDX --version 6.2.0
          dotnet CycloneDX src/BaryoDev.Umbraco.Pwa/BaryoDev.Umbraco.Pwa.csproj \
            --output ./nupkgs --filename sbom.json --json
          COMPONENTS=$(python3 -c 'import json;print(len(json.load(open("./nupkgs/sbom.json")).get("components",[])))')
          test "$COMPONENTS" -gt 0 || { echo "::error::The SBOM lists no components."; exit 1; }
          echo "SBOM lists $COMPONENTS components."

      # Proves these bytes came from this workflow at this commit. Worth being accurate about what
      # that buys: nuget.org neither surfaces nor verifies it, so it covers the artifact attached
      # to the GitHub release, checkable with `gh attestation verify`. Do not overclaim it.
      - name: Attest the package build provenance
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./nupkgs/*.nupkg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkgs
          path: ./nupkgs/*

      # ---------------------------------------------------------------------------------------
      # Everything above proves the source is correct. Nothing above proves the PACKAGE is, and
      # they are different claims.
      #
      # Every test here, and the demo site, consume the library through a ProjectReference. A
      # PackageReference resolves differently in exactly the places this package lives: static web
      # assets travel through different plumbing, .props and .targets only apply when consumed as
      # a package, and per-framework dependency groups are a package concept a project reference
      # does not have.
      #
      # See DELIVERY.md in BaryoDev/.github for why each of these gates exists.
      # ---------------------------------------------------------------------------------------

      - name: Install the package into a scratch site, as a consumer would
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          FEED="$PWD/nupkgs"
          WORK=$(mktemp -d)
          cd "$WORK"

          dotnet new web -o consumer --framework net10.0 >/dev/null
          cd consumer

          # A local feed only for this package. Restoring it from nuget.org would silently resolve
          # an already published version and prove nothing about the bytes just built.
          cat > nuget.config <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$FEED" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          XML

          dotnet add package BaryoDev.Umbraco.Pwa --version "$VERSION" --source "$FEED"
          dotnet build --configuration Release

          # Parsed, not grepped. Two greps for the file and the path can match two different asset
          # records, so a manifest with the file at the wrong path and some other asset at the
          # right one would pass. This requires ONE record carrying both.
          MANIFEST=$(find obj -name 'staticwebassets.build.json' | head -1)
          test -n "$MANIFEST" || {
            echo "::error::No static web assets manifest. The package contributed no client assets." && exit 1
          }

          python3 - "$MANIFEST" <<'PY'
          import json, sys

          assets = json.load(open(sys.argv[1])).get("Assets", [])
          want_base = "App_Plugins/BaryoDev.Pwa"

          at_base = [a for a in assets if a.get("BasePath", "").strip("/") == want_base]
          if at_base:
              print(f"Consumer resolves {len(at_base)} asset(s) at {want_base}")
              sys.exit(0)

          print(f"::error::No package assets are mapped to {want_base}.")
          for b in sorted({a.get("BasePath") for a in assets}):
              print(f"  saw BasePath={b!r}")
          sys.exit(1)
          PY

          # While the package is installed here, read the MVID of the assembly that came out of it.
          # The playground gate below compares the running server against this, so it is read from
          # the consumer's resolved package rather than this repo's own build output.
          cat > Program.cs <<'CS'
          System.Console.WriteLine(
              typeof(BaryoDev.Umbraco.Pwa.PwaOptions)
                  .Assembly.ManifestModule.ModuleVersionId);
          CS

          dotnet run --configuration Release --no-restore > /tmp/consumer-output 2>&1 || {
            echo "::error::The scratch consumer failed to run."; cat /tmp/consumer-output; exit 1;
          }
          # The GUID, not the whole stream. `dotnet run` writes build output to the same place as
          # the program, and a NuGet advisory published against any transitive dependency adds more
          # of it without anything here changing, which is how this came to log a wall of warnings
          # where a mvid was expected.
          grep -oE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' \
            /tmp/consumer-output | tail -1 > /tmp/package-mvid
          test -s /tmp/package-mvid || {
            echo "::error::Could not find an mvid in the consumer output."; cat /tmp/consumer-output; exit 1;
          }
          echo "The package installs and loads. Assembly mvid $(cat /tmp/package-mvid)"

      - name: Refuse to publish a build the playground has not run
        env:
          PLAYGROUND: https://dev-playground.baryo.dev
        run: |
          # The playground exists so a build is observed working somewhere real before anyone can
          # install it. That is only true if it is enforced.
          #
          # The server marker rather than the generated client script. A version string cannot tell
          # one 0.2.0 from another, and a server-only change leaves the client byte identical, which
          # is where most defects live.
          # Content type asserted, not just the status. Umbraco's content pipeline answers 200 with
          # the site's own HTML for any path it does not recognise, so a missing endpoint looks
          # exactly like a working one to a status check. Verified against the live demo.
          TYPE=$(curl -sS --max-time 30 -o /tmp/build-info -w '%{content_type}' "$PLAYGROUND/build-info") || {
            echo "::error::Could not reach the playground." && exit 1
          }
          case "$TYPE" in
            application/json*) ;;
            *)
              echo "::error::/build-info returned $TYPE, not JSON. The deployed build does not carry the marker."
              echo "Deploy this commit first: baryovm stack release umbraco-pwa"
              exit 1 ;;
          esac

          # The source hash rather than an assembly mvid. The playground builds from source in
          # Docker with no .git present, while this job packs on a runner where SourceLink embeds
          # repository metadata, so the same source produces two different assemblies and two
          # different mvids. That comparison could never pass. The source is the thing both sides
          # can agree on, and it is what the gate means to ask about.
          LIVE_HASH=$(python3 - <<'PY'
          import json, re, sys

          value = json.load(open("/tmp/build-info")).get("sourceHash", "")
          # Shape checked so a null, an empty string or a truncated value cannot quietly compare
          # equal to something later, or pass through as a plausible-looking blank.
          if not re.fullmatch(r"[0-9a-f]{64}", value or ""):
              print(f"::error::/build-info returned no usable sourceHash: {value!r}", file=sys.stderr)
              print("The playground predates the source-hash marker. Deploy this commit first:", file=sys.stderr)
              print("  baryovm stack release umbraco-pwa", file=sys.stderr)
              sys.exit(1)
          print(value)
          PY
          ) || exit 1

          # The same script the image ran, so the two answers cannot drift apart.
          BUILD_HASH=$(sh scripts/source-hash.sh)

          echo "  live  $LIVE_HASH"
          echo "  build $BUILD_HASH"

          if [ "$LIVE_HASH" != "$BUILD_HASH" ]; then
            echo "::error::The playground is running different source to the one being published."
            echo "Deploy this commit first: baryovm stack release umbraco-pwa"
            exit 1
          fi
          echo "Playground is running this exact source."

      - name: Smoke test the playground
        env:
          PLAYGROUND: https://dev-playground.baryo.dev
        run: |
          fail=0
          check() {
            actual=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$PLAYGROUND$1")
            if [ "$actual" = "$2" ]; then printf '  ok    %-34s %s\n' "$1" "$actual"
            else printf '  FAIL  %-34s got %s want %s\n' "$1" "$actual" "$2"; fail=1; fi
          }

          check "/" 200
          check "/manifest.webmanifest" 200
          check "/sw.js" 200
          check "/baryodev-pwa.js" 200
          test "$fail" = "0" || { echo "::error::The playground is not serving its assets."; exit 1; }

          # The three defects 0.2.0 fixed were all in the generated client, and all invisible to a
          # status code. These assert the behaviour rather than the response.
          CLIENT=$(curl -s --max-time 30 "$PLAYGROUND/baryodev-pwa.js")

          # This demo runs at a domain root, so BASE is empty here and an absolute URL would be
          # accidentally correct. That is exactly how the path-base defect survived to release, so
          # assert the EXPRESSION, which is wrong in every deployment shape if it regresses.
          printf '%s' "$CLIENT" | grep -q 'fetch(BASE + "/umbraco/pwa/api/report"' || {
            echo "::error::The client posts to an absolute report path again. It will miss on any prefixed site." && exit 1
          }
          printf '%s' "$CLIENT" | grep -q 'register(BASE + "/sw.js"' || {
            echo "::error::The service worker is registered from the domain root again. Offline support breaks under a prefix." && exit 1
          }
          printf '%s' "$CLIENT" | grep -q 'MANIFEST_DISPLAY === "fullscreen"' || {
            echo "::error::Fullscreen is being counted as an install again." && exit 1
          }

          # A manifest that does not parse is an install prompt that never appears, with no error
          # anywhere. Written as a heredoc rather than a -c one-liner because nesting escaped
          # quotes inside a shell-quoted f-string does not survive, which this did not on the
          # first attempt.
          curl -s --max-time 30 -o /tmp/manifest.json "$PLAYGROUND/manifest.webmanifest"
          python3 - <<'PY'
          import json, sys

          m = json.load(open("/tmp/manifest.json"))
          missing = [k for k in ("name", "start_url", "display", "icons") if not m.get(k)]
          if missing:
              print(f"::error::The manifest is missing {', '.join(missing)}, so the site is not installable.")
              sys.exit(1)
          print("  manifest ok, display=" + str(m.get("display")) + ", icons=" + str(len(m["icons"])))
          PY

          echo "Playground healthy."

      # Requested here rather than earlier because the key expires after an
      # hour and each OIDC token buys exactly one key.
      # Runs on dry runs too, so a dry run actually verifies the trusted
      # publishing policy. Obtaining a key publishes nothing.
      - name: Exchange OIDC token for a short-lived NuGet key
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER || 'arnelirobles' }}

      - name: Confirm the key was issued
        env:
          # Through the environment rather than interpolated into the script. An expression is
          # substituted into the shell source before the shell parses it, so a value containing
          # shell syntax would be executed rather than compared, and it can surface in a trace.
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::No API key returned. Check the trusted publishing policy on nuget.org." && exit 1
          fi
          echo "Trusted publishing OK: short-lived key issued."

      # Publication requires a tag push, and only a tag push. The tag-match step above is itself
      # conditional on a tag ref, so a dispatched run with dry_run unticked would otherwise reach
      # push with the version check skipped rather than passed.
      - name: Publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
