name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and on every push. A committed credential is not something to discover later:
  # anything that reaches a public repo has to be treated as disclosed, not merely removed.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan history, not just the tip

      # The gitleaks binary is MIT licensed and free. Their GitHub Action is not: it refuses to
      # run for an organization without a paid licence key. Same scanner, same config, no licence.
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

  # The package multi-targets, so this proves both halves compile and that the packed nuspec still
  # satisfies what the Umbraco Marketplace requires to list it.
  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - run: dotnet build src/BaryoDev.Umbraco.Pwa -c Release

      - run: dotnet pack src/BaryoDev.Umbraco.Pwa -c Release --no-build -o artifacts

      # Neither condition fails a build when broken, and both are invisible until the listing
      # silently does not appear on the marketplace.
      - name: Verify marketplace requirements
        run: |
          cd artifacts
          unzip -p *.nupkg '*.nuspec' > spec.xml
          grep -q 'umbraco-marketplace' spec.xml || { echo "missing umbraco-marketplace tag"; exit 1; }
          grep -q 'id="Umbraco.Cms' spec.xml       || { echo "missing direct Umbraco.Cms dependency"; exit 1; }
          echo "tag and Umbraco.Cms dependency both present"
          echo "--- advertised compatibility ---"
          grep -o 'id="Umbraco.Cms.Api.Management" version="[^"]*"' spec.xml

      - name: Both target frameworks shipped
        run: |
          cd artifacts
          unzip -l *.nupkg | grep -q 'lib/net9.0/'  || { echo "net9.0 missing (Umbraco 16)"; exit 1; }
          unzip -l *.nupkg | grep -q 'lib/net10.0/' || { echo "net10.0 missing (Umbraco 17, 18)"; exit 1; }
          echo "net9.0 and net10.0 both present"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # Every supported major, each booting a real Umbraco on SQLite. A version range in the csproj is
  # a claim; this is the evidence for it.
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - umbraco: "16.5.1"
            framework: net9.0
            note: "standard-term support"
          - umbraco: "17.6.1"
            framework: net10.0
            note: "current LTS"
          - umbraco: "18.1.0"
            framework: net10.0
            note: "latest"

    name: Umbraco ${{ matrix.umbraco }} (${{ matrix.framework }}, ${{ matrix.note }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # No TargetFrameworks override here. Passing it turns the single-targeted test project into
      # a multi-targeting one, and `dotnet test` then silently discovers nothing. The test project
      # already derives its own TargetFramework from UmbracoVersion, and a ProjectReference picks
      # the matching asset out of the multi-targeted package on its own.
      - name: Test
        run: >
          dotnet test tests/BaryoDev.Umbraco.Pwa.Tests
          -p:UmbracoVersion=${{ matrix.umbraco }}
          --logger "trx;LogFileName=results.trx"
          --results-directory ${{ github.workspace }}/testresults
          --verbosity normal

      # A run that discovers no tests exits zero. Without this the whole matrix can go green
      # while proving nothing, which is exactly what happened the first time it was written.
      - name: Assert the tests actually ran
        run: |
          TRX=$(find "${{ github.workspace }}/testresults" -name 'results.trx' | head -1)
          test -n "$TRX" || { echo "no trx produced: nothing ran"; exit 1; }
          TOTAL=$(grep -o 'total="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*')
          PASSED=$(grep -o 'passed="[0-9]*"' "$TRX" | head -1 | grep -o '[0-9]*')
          echo "total=$TOTAL passed=$PASSED"
          test "${TOTAL:-0}" -ge 50 || { echo "expected at least 50 tests, got ${TOTAL:-0}"; exit 1; }
          test "$TOTAL" = "$PASSED" || { echo "not every test passed"; exit 1; }

      - name: Verify the framework under test
        run: |
          test -d tests/BaryoDev.Umbraco.Pwa.Tests/bin/Debug/${{ matrix.framework }} \
            || { echo "expected ${{ matrix.framework }} output for Umbraco ${{ matrix.umbraco }}"; exit 1; }
          echo "ran on ${{ matrix.framework }} as intended"
