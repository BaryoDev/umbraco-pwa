  - name: Question about using the package
    url: https://github.com/BaryoDev/umbraco-pwa/discussions
    about: Usage questions are better as a discussion than an issue.
  - name: Security issue
    url: https://github.com/BaryoDev/.github/blob/main/SECURITY.md
    about: Please do not open a public issue for anything security related.
